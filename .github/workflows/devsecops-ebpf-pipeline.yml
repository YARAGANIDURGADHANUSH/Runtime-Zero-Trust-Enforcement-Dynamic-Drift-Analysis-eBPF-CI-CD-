name: DevSecOps eBPF Zero-Trust Pipeline

on:
  push:
    branches: ["main"]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  security-events: write

jobs:
  build-scan-profile-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt requests

      - name: Build Docker Image
        run: |
          docker build -t devsecops-pipeline:latest .

      - name: Run Container & Profile Behavior
        run: |
          # Start application container in background
          docker run -d -p 5000:5000 --name devsecops-app devsecops-pipeline:latest
          
          # Health check polling loop with explicit failure protection
          echo "Waiting for container readiness..."
          SUCCESS=0
          for i in {1..10}; do
            if curl -s http://localhost:5000/health | grep "ok"; then
              echo "Container is healthy!"
              SUCCESS=1
              break
            fi
            echo "Waiting for port 5000... attempt $i"
            sleep 2
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "ERROR: Container failed to start. Logs:"
            docker logs devsecops-app
            exit 1
          fi

          # Execute modular traffic generator script
          echo "Generating behavioral traffic..."
          python scripts/generate_traffic.py http://localhost:5000

      - name: Stop and Clean Container
        run: |
          docker stop devsecops-app
          docker rm devsecops-app

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-pipeline:latest'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      - name: Parse Trace & Generate Baseline Profile
        run: |
          mkdir -p ebpf
          python ebpf/profile_generator.py ebpf/trace_output.json ebpf/baseline-profile.json

      - name: Upload eBPF Profile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebpf-baseline-profile
          path: ebpf/baseline-profile.json

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image to Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-pipeline:latest

      - name: Deploy to AWS EC2 via SSH
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-pipeline:latest
            sudo docker stop devsecops-app || true
            sudo docker rm devsecops-app || true
            sudo docker run -d -p 80:5000 --name devsecops-app --restart unless-stopped ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-pipeline:latest
            sleep 3
            curl -f http://localhost/health || exit 1